<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subtitle Generator - CapCut Dynamic Pro + SRT Import</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #0b0e14;
            color: #eef2f5;
            display: flex;
            justify-content: center;
            padding: 16px 12px;
            min-height: 100vh;
            align-items: flex-start;
        }

        .app {
            max-width: 560px;
            width: 100%;
            background: #1a1f27;
            border-radius: 28px;
            padding: 20px 16px 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid #2e3742;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 small {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-left: auto;
        }

        .card {
            background: #252d38;
            border-radius: 20px;
            padding: 16px 14px;
            margin-top: 14px;
            border: 1px solid #303a48;
        }

        label {
            font-weight: 500;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 6px;
            color: #b6c8e0;
        }

        input[type="file"],
        textarea,
        select,
        input[type="color"],
        input[type="number"] {
            width: 100%;
            background: #141a22;
            border: 1px solid #384452;
            border-radius: 14px;
            padding: 10px 14px;
            color: #eef2f5;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .row-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .preview-box {
            margin-top: 16px;
            background: #0f141c;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #2f3a48;
            position: relative;
        }

        video,
        #previewCanvas {
            width: 100%;
            display: block;
            background: #000;
            max-height: 300px;
            object-fit: contain;
        }

        .preview-controls {
            background: #0f141c;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #2f3a48;
        }

        .preview-controls button {
            background: #1f2a36;
            border: 1px solid #384452;
            border-radius: 20px;
            padding: 5px 14px;
            color: #b6c8e0;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .preview-controls input[type="range"] {
            flex: 1;
            accent-color: #f7c948;
        }

        .action-btn {
            width: 100%;
            background: #f7c948;
            border: none;
            border-radius: 60px;
            padding: 16px 12px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #0b0e14;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 #a0812b;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a0812b;
        }

        .render-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .render-row .action-btn {
            margin-top: 0;
            flex: 1;
        }

        .preview-btn {
            background: #2a3848;
            border: 1px solid #384452;
            border-radius: 60px;
            padding: 0 20px;
            font-weight: 600;
            color: #b6c8e0;
            cursor: pointer;
        }

        .preview-btn.active {
            background: #3d1f1f;
            border-color: #ff6b63;
            color: #ff8a80;
        }

        .status-badge {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 30px;
            background: #1b232e;
            font-size: 0.9rem;
            text-align: center;
            color: #b0c8e0;
            border-left: 4px solid #f7c948;
        }

        .download-link {
            display: block;
            margin-top: 18px;
            background: #2b3543;
            padding: 14px;
            border-radius: 60px;
            text-align: center;
            color: #b6d0f0;
            text-decoration: none;
            font-weight: 500;
            border: 1px solid #42505e;
        }

        .download-link.active {
            background: #2f8e4b;
            color: white;
        }

        .hint {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 4px;
        }

        .subtitle-toolbar {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: #1f2a36;
            border: 1px solid #384452;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #b6c8e0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn:hover {
            border-color: #f7c948;
            color: #fff;
        }

        .tool-btn.clear-btn {
            color: #ff8a80;
            border-color: #5a2d2d;
        }

        .tool-btn.paste-btn {
            color: #8cd9a0;
            border-color: #2d5a3a;
        }

        .tool-btn.srt-btn {
            color: #8db4ff;
            border-color: #2d3d5a;
        }

        .tool-btn.import-btn {
            color: #d9b0ff;
            border-color: #4a2d5a;
        }

        #segmentEditor {
            margin-top: 12px;
        }

        #segmentList {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .seg-card {
            background: #141a22;
            border: 1px solid #384452;
            border-radius: 12px;
            padding: 10px 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .seg-card-header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #5a7090;
        }

        .seg-card-header button {
            margin-left: auto;
            background: none;
            border: none;
            color: #ff6b63;
            cursor: pointer;
        }

        .seg-field {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .seg-field label {
            font-size: 0.65rem;
            color: #5a7090;
            margin: 0;
        }

        .seg-field input {
            background: #0e141c;
            border: 1px solid #2e3a48;
            border-radius: 8px;
            padding: 5px 8px;
            color: #eef2f5;
            font-size: 0.8rem;
            width: 100%;
        }

        .seg-text-field {
            grid-column: 1 / -1;
        }

        .seg-time-btn {
            background: #1f2a36;
            border: 1px solid #384452;
            border-radius: 6px;
            padding: 2px 6px;
            color: #b6c8e0;
            font-size: 0.65rem;
            cursor: pointer;
            margin-top: 2px;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-group input[type="color"] {
            width: 40px;
            height: 35px;
            padding: 2px;
            cursor: pointer;
            background: #141a22;
        }

        .preset-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .preset-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #384452;
            cursor: pointer;
            padding: 0;
            transition: 0.15s;
        }

        .preset-dot:hover {
            transform: scale(1.15);
            border-color: #f7c948;
        }

        .preset-dot.active {
            border-color: #f7c948;
            box-shadow: 0 0 0 2px rgba(247, 201, 72, 0.4);
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #141a22;
            border: 1px solid #384452;
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 10px;
        }

        .toggle-row label {
            margin: 0;
            flex: 1;
            font-size: 0.85rem;
            color: #b6c8e0;
            cursor: pointer;
        }

        .switch {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-sw {
            position: absolute;
            inset: 0;
            background: #2a3542;
            border-radius: 24px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #384452;
        }

        .slider-sw::before {
            content: '';
            position: absolute;
            height: 16px;
            width: 16px;
            left: 3px;
            top: 3px;
            background: #7a90a8;
            border-radius: 50%;
            transition: 0.2s;
        }

        .switch input:checked+.slider-sw {
            background: #f7c948;
            border-color: #f7c948;
        }

        .switch input:checked+.slider-sw::before {
            transform: translateX(20px);
            background: #0b0e14;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>✨ CapCut Style <small>Dynamic Pro + SRT</small></h1>

        <!-- Upload Video -->
        <div class="card">
            <label for="videoInput">📁 Pilih Video (.mp4, .webm)</label>
            <input type="file" id="videoInput" accept="video/mp4,video/webm">
        </div>

        <!-- Styling & Custom Text Options -->
        <div class="card">
            <label>🎨 Kustomisasi Teks & Ukuran Font</label>
            <!-- Toggle Background Solid -->
            <div class="toggle-row">
                <label for="solidBgToggle">🎬 Background Solid (video disembunyikan, hanya subtitle di atas
                    warna)</label>
                <div class="switch">
                    <input type="checkbox" id="solidBgToggle" checked>
                    <span class="slider-sw"></span>
                </div>
            </div>

            <div id="solidBgOptions">
                <div class="row-2col" style="margin-bottom: 10px;">
                    <div>
                        <label style="font-size:0.75rem;">Warna Background Solid</label>
                        <div class="color-picker-group">
                            <input type="color" id="solidBgColor" value="#000000">
                            <span style="font-size:0.8rem;" id="solidBgColorVal">#000000</span>
                        </div>
                        <div class="preset-row" id="solidPresetRow">
                            <button class="preset-dot active" data-color="#000000" style="background:#000000;"
                                title="Hitam"></button>
                            <button class="preset-dot" data-color="#FFFFFF" style="background:#FFFFFF;"
                                title="Putih"></button>
                            <button class="preset-dot" data-color="#00FF00" style="background:#00FF00;"
                                title="Hijau"></button>
                            <button class="preset-dot" data-color="#0000FF" style="background:#0000FF;"
                                title="Biru"></button>
                            <button class="preset-dot" data-color="#1A1F27" style="background:#1A1F27;"
                                title="Dark Grey"></button>
                        </div>
                    </div>
                    <div>
                        <label style="font-size:0.75rem;">Info Ukuran</label>
                        <div class="hint" id="sizeHint" style="margin-top:0; line-height:1.5;">
                            Bitrate otomatis: <b>~800 kbps</b><br>
                            Estimasi file kecil ✅
                        </div>
                    </div>
                </div>
            </div>

            <div class="row-2col" style="margin-bottom: 10px;">
                <div>
                    <label style="font-size:0.75rem;">Warna Teks Utama</label>
                    <div class="color-picker-group">
                        <input type="color" id="textColor" value="#FFD966">
                        <span style="font-size:0.8rem;" id="textColorVal">#FFD966</span>
                    </div>
                </div>
                <div>
                    <label style="font-size:0.75rem;">Warna Background Teks</label>
                    <div class="color-picker-group">
                        <input type="color" id="bgColor" value="#000000">
                        <input type="checkbox" id="useBg" checked title="Aktifkan Background"> <span
                            style="font-size:0.8rem;">Aktif</span>
                    </div>
                </div>
            </div>

            <div class="row-2col" style="margin-bottom: 10px;">
                <div>
                    <label style="font-size:0.75rem;">Mode Teks</label>
                    <select id="animStyle">
                        <option value="none">Normal (Auto-Wrap Kalimat)</option>
                        <option value="word" selected>Per Kata (1 Baris Berganti Cepat)</option>
                        <option value="typewriter">Typewriter (Syntax Style - Negoro Angin)</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:0.75rem;">Ukuran Font Dasar (px)</label>
                    <input type="number" id="fontSizeInput" value="36" min="16" max="90" step="2">
                </div>
            </div>

            <div class="row-2col" style="margin-top:8px;">
                <div>
                    <label style="font-size:0.75rem;">🎭 Tema Negoro Angin</label>
                    <select id="negroTheme">
                        <option value="classic" selected>Classic (Biru-Kuning)</option>
                        <option value="matrix">Matrix (Hijau Neon)</option>
                        <option value="sunset">Sunset (Oranye-Ungu)</option>
                        <option value="cyberpunk">Cyberpunk (Pink-Cyan)</option>
                        <option value="monokai">Monokai (Pro Code)</option>
                        <option value="dracula">Dracula (Ungu Lembut)</option>
                        <option value="nord">Nord (Biru Dingin)</option>
                        <option value="tokyo">Tokyo Night (Biru-Pink)</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:0.75rem;">⌨️ Kecepatan Ketik</label>
                    <select id="typingSpeed">
                        <option value="slow">Lambat (0.15s/char)</option>
                        <option value="normal" selected>Normal (0.08s/char)</option>
                        <option value="fast">Cepat (0.04s/char)</option>
                        <option value="instant">Instan (Langsung penuh)</option>
                    </select>
                </div>
            </div>

            <div class="row-2col" style="margin-top:8px;">
                <div>
                    <label style="font-size:0.75rem;">🖱️ Efek Kursor</label>
                    <select id="cursorStyle">
                        <option value="block" selected>Block (█)</option>
                        <option value="line">Line (|)</option>
                        <option value="underline">Underline (_)</option>
                        <option value="blink">Block Berkedip</option>
                        <option value="none">Tanpa Kursor</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:0.75rem;">📐 Gaya Tampilan</label>
                    <select id="negroLayout">
                        <option value="code" selected>Kode Editor (dengan header)</option>
                        <option value="plain">Polos (hanya teks)</option>
                        <option value="terminal">Terminal (prompt $)</option>
                    </select>
                </div>
            </div>

            <div class="row-2col">
                <div>
                    <label style="font-size:0.75rem;">Layout Posisi Vertikal</label>
                    <select id="layoutPos">
                        <option value="bottom" selected>Bawah (Bottom)</option>
                        <option value="top">Atas (Top)</option>
                        <option value="center">Tengah (Center)</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:0.75rem;">Perataan Teks</label>
                    <select id="textAlign">
                        <option value="center" selected>Tengah</option>
                        <option value="left">Kiri</option>
                        <option value="right">Kanan</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Data Subtitle JSON & Segment Editor + IMPORT SRT -->
        <div class="card">
            <label for="subtitleData">✏️ Data Subtitle (JSON)</label>
            <textarea id="subtitleData">[
  { "start": 0, "end": 2.5, "text": "Halo selamat datang di editor subtitle keren ini" },
  { "start": 2.8, "end": 5.0, "text": "Tanpa outline hitam, teks jadi terlihat lebih bersih" },
  { "start": 5.5, "end": 8.0, "text": "Atur ukuran font sesuai kebutuhan video kamu!" }
]</textarea>

            <div class="subtitle-toolbar">
                <button class="tool-btn paste-btn" id="pasteBtn">📋 Paste</button>
                <button class="tool-btn clear-btn" id="clearBtn">🗑️ Clear</button>
                <button class="tool-btn" id="formatBtn">✨ Format</button>
                <button class="tool-btn srt-btn" id="exportSrtBtn">💾 Export SRT</button>
                <button class="tool-btn import-btn" id="importSrtBtn">📂 Import SRT</button>
            </div>

            <!-- Hidden file input for SRT import -->
            <input type="file" id="srtFileInput" accept=".srt,text/plain" style="display:none;">

            <div id="segmentEditor">
                <label style="margin-top:10px; font-size:0.8rem;">📝 Editor Segmen Interaktif</label>
                <div id="segmentList"></div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <button class="tool-btn" id="addSegBtn">+ Tambah Segmen</button>
                    <button class="tool-btn" id="sortSegBtn">⬆ Urutkan Waktu</button>
                </div>
            </div>
        </div>

        <!-- Pilihan Resolusi & Format -->
        <div class="card">
            <label>📐 Resolusi & Format Output</label>
            <div class="row-2col">
                <select id="resolutionSelect">
                    <option value="480x854">Hemat Data (480x854)</option>
                    <option value="540x960">Standar Ringan (540x960)</option>
                    <option value="720x1280" selected>TikTok / Reels (720x1280)</option>
                    <option value="1080x1920">Full HD Vertical (1080x1920)</option>
                    <option value="1280x720">YouTube Landscape (1280x720)</option>
                </select>
                <div>
                    <select id="formatSelect">
                        <option value="mp4" selected>MP4 (H.264) *</option>
                        <option value="webm">WebM (Universal)</option>
                    </select>
                    <div class="hint" id="formatHint">* MP4 didukung tergantung browser</div>
                </div>
            </div>
        </div>

        <!-- Preview Box -->
        <div class="preview-box">
            <video id="sourceVideo" muted playsinline></video>
            <canvas id="previewCanvas"></canvas>
            <div class="preview-controls" id="previewControls" style="display:none;">
                <button id="playPauseBtn">▶</button>
                <input type="range" id="seekBar" min="0" max="100" step="0.1" value="0">
                <span id="timeDisplay" style="font-size:0.75rem; color:#7a90a8;">0:00</span>
            </div>
        </div>

        <!-- Render & Preview Buttons -->
        <div class="render-row">
            <button class="action-btn" id="renderBtn">▶ Mulai Render Video</button>
            <button class="preview-btn" id="previewBtn">👁 Preview</button>
        </div>

        <div id="statusMessage" class="status-badge">📹 Pilih video & atur subtitle, lalu klik Render.</div>
        <a href="#" id="downloadLink" class="download-link" download="capcut_subtitle.mp4">⬇️ Hasil video akan muncul di
            sini</a>

        <canvas id="canvas-preview" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;"></canvas>
    </div>

    <script>
        (function () {
            'use strict';

            const videoInput = document.getElementById('videoInput');
            const subtitleTextarea = document.getElementById('subtitleData');
            const sourceVideo = document.getElementById('sourceVideo');
            const renderBtn = document.getElementById('renderBtn');
            const statusMsg = document.getElementById('statusMessage');
            const downloadLink = document.getElementById('downloadLink');
            const resolutionSelect = document.getElementById('resolutionSelect');
            const formatSelect = document.getElementById('formatSelect');
            const formatHint = document.getElementById('formatHint');

            const pasteBtn = document.getElementById('pasteBtn');
            const clearBtn = document.getElementById('clearBtn');
            const formatBtn = document.getElementById('formatBtn');
            const exportSrtBtn = document.getElementById('exportSrtBtn');
            const importSrtBtn = document.getElementById('importSrtBtn');
            const srtFileInput = document.getElementById('srtFileInput');

            const segmentList = document.getElementById('segmentList');
            const addSegBtn = document.getElementById('addSegBtn');
            const sortSegBtn = document.getElementById('sortSegBtn');

            const solidBgToggle = document.getElementById('solidBgToggle');
            const solidBgOptions = document.getElementById('solidBgOptions');
            const solidBgColorInput = document.getElementById('solidBgColor');
            const solidBgColorVal = document.getElementById('solidBgColorVal');
            const solidPresetRow = document.getElementById('solidPresetRow');
            const sizeHint = document.getElementById('sizeHint');
            const textColorInput = document.getElementById('textColor');
            const textColorVal = document.getElementById('textColorVal');
            const bgColorInput = document.getElementById('bgColor');
            const useBgCheckbox = document.getElementById('useBg');
            const animStyleSelect = document.getElementById('animStyle');
            const fontSizeInput = document.getElementById('fontSizeInput');
            const layoutPosSelect = document.getElementById('layoutPos');
            const textAlignSelect = document.getElementById('textAlign');
            const negroThemeSelect = document.getElementById('negroTheme');
            const typingSpeedSelect = document.getElementById('typingSpeed');
            const cursorStyleSelect = document.getElementById('cursorStyle');
            const negroLayoutSelect = document.getElementById('negroLayout');

            const canvas = document.getElementById('canvas-preview');
            const previewCanvas = document.getElementById('previewCanvas');
            const previewCtx = previewCanvas.getContext('2d');

            const previewBtn = document.getElementById('previewBtn');
            const previewControls = document.getElementById('previewControls');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const seekBar = document.getElementById('seekBar');
            const timeDisplay = document.getElementById('timeDisplay');

            textColorInput.addEventListener('input', () => textColorVal.textContent = textColorInput.value);
            // ─── Background Solid: toggle ───
            function updateSolidUI() {
                solidBgOptions.style.display = solidBgToggle.checked ? 'block' : 'none';
                updateSizeHint();
            }
            function updateSizeHint() {
                if (!sizeHint) return;
                if (solidBgToggle.checked) {
                    sizeHint.innerHTML = 'Bitrate otomatis: <b>~800 kbps</b><br>Estimasi file kecil ✅';
                    sizeHint.style.color = '#8cd9a0';
                } else {
                    sizeHint.innerHTML = 'Bitrate otomatis: <b>~4000 kbps</b><br>Video tampil penuh';
                    sizeHint.style.color = '#b6c8e0';
                }
            }
            solidBgToggle.addEventListener('change', updateSolidUI);
            solidBgColorInput.addEventListener('input', () => {
                solidBgColorVal.textContent = solidBgColorInput.value.toUpperCase();
                // hapus active dari preset kalau warna tidak cocok
                document.querySelectorAll('#solidPresetRow .preset-dot').forEach(d => {
                    d.classList.toggle('active', d.dataset.color.toLowerCase() === solidBgColorInput.value.toLowerCase());
                });
            });
            solidPresetRow.addEventListener('click', (e) => {
                const btn = e.target.closest('.preset-dot');
                if (!btn) return;
                solidBgColorInput.value = btn.dataset.color;
                solidBgColorInput.dispatchEvent(new Event('input'));
            });
            updateSolidUI();
            solidBgColorInput.dispatchEvent(new Event('input')); // sinkronkan label awal

            const RESOLUTIONS = {
                '480x854': { width: 480, height: 854 },
                '540x960': { width: 540, height: 960 },
                '720x1280': { width: 720, height: 1280 },
                '1080x1920': { width: 1080, height: 1920 },
                '1280x720': { width: 1280, height: 720 }
            };

            const NEGRO_THEMES = {
                classic:   { keyword: '#6fd3e8', string: '#b9d36c', punct: '#e8a35a', text: '#FFD966', bg: '#0d1117', cursor: '#ff2d2d' },
                matrix:    { keyword: '#00ff41', string: '#7dffb0', punct: '#00cc33', text: '#b8ffcc', bg: '#000d00', cursor: '#00ff41' },
                sunset:    { keyword: '#ff9a56', string: '#ffd166', punct: '#ff6b9d', text: '#ffe0b2', bg: '#1a0f1a', cursor: '#ff9a56' },
                cyberpunk: { keyword: '#00fff0', string: '#ff2d95', punct: '#ffe600', text: '#e0f7ff', bg: '#0a0014', cursor: '#ff2d95' },
                monokai:   { keyword: '#66d9ef', string: '#e6db74', punct: '#f92672', text: '#f8f8f2', bg: '#272822', cursor: '#f92672' },
                dracula:   { keyword: '#8be9fd', string: '#50fa7b', punct: '#ff79c6', text: '#f8f8f2', bg: '#282a36', cursor: '#ff79c6' },
                nord:      { keyword: '#88c0d0', string: '#a3be8c', punct: '#b48ead', text: '#eceff4', bg: '#2e3440', cursor: '#bf616a' },
                tokyo:     { keyword: '#7aa2f7', string: '#9ece6a', punct: '#bb9af7', text: '#c0caf5', bg: '#1a1b26', cursor: '#f7768e' },
            };

            const TYPING_SPEEDS = {
                slow: 0.15,
                normal: 0.08,
                fast: 0.04,
                instant: 0
            };

            function getSupportedMimeType(format) {
                const mimeTypes = {
                    'webm': ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'],
                    'mp4': ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4']
                };
                const types = mimeTypes[format] || mimeTypes['webm'];
                for (let mime of types) {
                    if (MediaRecorder.isTypeSupported(mime)) return mime;
                }
                return null;
            }

            function updateFormatHint() {
                const format = formatSelect.value;
                const mime = getSupportedMimeType(format);
                if (mime) {
                    formatHint.innerHTML = `✅ Format ${format.toUpperCase()} didukung browser`;
                    formatHint.style.color = '#8cd9a0';
                } else {
                    formatHint.innerHTML = `⚠️ Format ${format.toUpperCase()} tidak didukung, fallback ke WebM`;
                    formatHint.style.color = '#ff6b63';
                }
            }
            formatSelect.addEventListener('change', updateFormatHint);
            updateFormatHint();

            function getSubtitles() {
                try {
                    const raw = subtitleTextarea.value.trim();
                    if (!raw) return [];
                    const parsed = JSON.parse(raw);
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) { return []; }
            }

            let _ignoreInput = false;

            function renderSegmentCards(data) {
                segmentList.innerHTML = '';
                if (!Array.isArray(data)) return;

                data.forEach((seg, i) => {
                    const card = document.createElement('div');
                    card.className = 'seg-card';

                    const header = document.createElement('div');
                    header.className = 'seg-card-header';
                    header.innerHTML = `<span>#${i + 1}</span>`;

                    const delBtn = document.createElement('button');
                    delBtn.textContent = '🗑️ Hapus';
                    delBtn.addEventListener('click', () => {
                        const cur = getSubtitles();
                        cur.splice(i, 1);
                        writeToTextarea(cur);
                    });
                    header.appendChild(delBtn);
                    card.appendChild(header);

                    const startF = document.createElement('div');
                    startF.className = 'seg-field';
                    startF.innerHTML = `<label>Start (s)</label>`;
                    const startIn = document.createElement('input');
                    startIn.type = 'number'; startIn.step = '0.1'; startIn.value = seg.start;
                    startIn.addEventListener('change', () => {
                        const cur = getSubtitles();
                        cur[i].start = parseFloat(startIn.value) || 0;
                        writeToTextarea(cur, true);
                    });
                    startF.appendChild(startIn);

                    const setStart = document.createElement('button');
                    setStart.className = 'seg-time-btn';
                    setStart.textContent = '⏱ Set Current';
                    setStart.addEventListener('click', () => {
                        startIn.value = parseFloat(sourceVideo.currentTime.toFixed(2));
                        startIn.dispatchEvent(new Event('change'));
                    });
                    startF.appendChild(setStart);
                    card.appendChild(startF);

                    const endF = document.createElement('div');
                    endF.className = 'seg-field';
                    endF.innerHTML = `<label>End (s)</label>`;
                    const endIn = document.createElement('input');
                    endIn.type = 'number'; endIn.step = '0.1'; endIn.value = seg.end;
                    endIn.addEventListener('change', () => {
                        const cur = getSubtitles();
                        cur[i].end = parseFloat(endIn.value) || 0;
                        writeToTextarea(cur, true);
                    });
                    endF.appendChild(endIn);

                    const setEnd = document.createElement('button');
                    setEnd.className = 'seg-time-btn';
                    setEnd.textContent = '⏱ Set Current';
                    setEnd.addEventListener('click', () => {
                        endIn.value = parseFloat(sourceVideo.currentTime.toFixed(2));
                        endIn.dispatchEvent(new Event('change'));
                    });
                    endF.appendChild(setEnd);
                    card.appendChild(endF);

                    const textF = document.createElement('div');
                    textF.className = 'seg-field seg-text-field';
                    textF.innerHTML = `<label>Teks Subtitle</label>`;
                    const textIn = document.createElement('input');
                    textIn.type = 'text'; textIn.value = seg.text;
                    textIn.addEventListener('change', () => {
                        const cur = getSubtitles();
                        cur[i].text = textIn.value;
                        writeToTextarea(cur, true);
                    });
                    textF.appendChild(textIn);
                    card.appendChild(textF);

                    segmentList.appendChild(card);
                });
            }

            function writeToTextarea(arr, skipRebuild = false) {
                _ignoreInput = true;
                subtitleTextarea.value = JSON.stringify(arr, null, 2);
                _ignoreInput = false;
                if (!skipRebuild) renderSegmentCards(arr);
            }

            subtitleTextarea.addEventListener('input', () => {
                if (_ignoreInput) return;
                const data = getSubtitles();
                if (data.length > 0) renderSegmentCards(data);
            });

            addSegBtn.addEventListener('click', () => {
                const cur = getSubtitles();
                const lastEnd = cur.length > 0 ? (cur[cur.length - 1].end || 0) : 0;
                cur.push({ start: lastEnd, end: lastEnd + 2, text: 'Teks baru' });
                writeToTextarea(cur);
            });

            sortSegBtn.addEventListener('click', () => {
                const cur = getSubtitles();
                cur.sort((a, b) => a.start - b.start);
                writeToTextarea(cur);
            });

            pasteBtn.addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    subtitleTextarea.value = text;
                    renderSegmentCards(getSubtitles());
                    statusMsg.textContent = '📋 Berhasil menempel dari clipboard';
                } catch (e) { statusMsg.textContent = '❌ Gagal membaca clipboard'; }
            });

            clearBtn.addEventListener('click', () => {
                subtitleTextarea.value = '[]';
                renderSegmentCards([]);
                statusMsg.textContent = '🗑️ Subtitle dikosongkan';
            });

            formatBtn.addEventListener('click', () => {
                try {
                    const parsed = JSON.parse(subtitleTextarea.value);
                    writeToTextarea(parsed);
                    statusMsg.textContent = '✨ Format JSON dirapikan';
                } catch (e) { statusMsg.textContent = '❌ Format JSON tidak valid'; }
            });

            // ─── EXPORT SRT ───
            exportSrtBtn.addEventListener('click', () => {
                const subs = getSubtitles();
                if (subs.length === 0) {
                    statusMsg.textContent = '❌ Tidak ada subtitle untuk di-export';
                    return;
                }
                let srt = '';
                subs.forEach((sub, i) => {
                    const fmtTime = (sec) => {
                        const pad = (n, z = 2) => String(n).padStart(z, '0');
                        const h = Math.floor(sec / 3600);
                        const m = Math.floor((sec % 3600) / 60);
                        const s = Math.floor(sec % 60);
                        const ms = Math.floor((sec % 1) * 1000);
                        return `${pad(h)}:${pad(m)}:${pad(s)},${pad(ms, 3)}`;
                    };
                    srt += `${i + 1}\n${fmtTime(sub.start)} --> ${fmtTime(sub.end)}\n${sub.text}\n\n`;
                });
                const blob = new Blob([srt], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'subtitle.srt';
                a.click();
                statusMsg.textContent = '💾 File SRT berhasil di-export!';
            });

            // ─── IMPORT SRT ───
            importSrtBtn.addEventListener('click', () => {
                srtFileInput.click();
            });

            srtFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    const content = ev.target.result;
                    const parsed = parseSRT(content);
                    if (parsed.length === 0) {
                        statusMsg.textContent = '❌ Gagal mengimpor SRT: format tidak valid atau kosong';
                        srtFileInput.value = '';
                        return;
                    }

                    // Tulis ke textarea dan render segmen
                    writeToTextarea(parsed);
                    statusMsg.textContent = `✅ Berhasil mengimpor ${parsed.length} subtitle dari SRT!`;
                    srtFileInput.value = ''; // reset agar bisa import file yang sama lagi
                };
                reader.readAsText(file, 'UTF-8');
            });

            // Parser SRT sederhana (mendukung format standar)
            function parseSRT(text) {
                const subs = [];
                // Normalisasi line endings dan split per blok
                const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                // Split berdasarkan baris kosong (satu atau lebih)
                const blocks = normalized.split(/\n\s*\n/);

                for (let block of blocks) {
                    block = block.trim();
                    if (!block) continue;

                    const lines = block.split('\n');
                    if (lines.length < 2) continue;

                    // Baris pertama mungkin nomor (bisa diabaikan)
                    let timeLineIndex = 0;
                    // Jika baris pertama adalah angka, maka timeLineIndex = 1
                    if (/^\d+$/.test(lines[0].trim())) {
                        timeLineIndex = 1;
                    }

                    if (lines.length <= timeLineIndex) continue;

                    const timeLine = lines[timeLineIndex].trim();
                    // Format: 00:00:01,000 --> 00:00:04,000
                    const timeMatch = timeLine.match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})/);
                    if (!timeMatch) continue;

                    const startH = parseInt(timeMatch[1], 10) || 0;
                    const startM = parseInt(timeMatch[2], 10) || 0;
                    const startS = parseInt(timeMatch[3], 10) || 0;
                    const startMs = parseInt(timeMatch[4], 10) || 0;
                    const endH = parseInt(timeMatch[5], 10) || 0;
                    const endM = parseInt(timeMatch[6], 10) || 0;
                    const endS = parseInt(timeMatch[7], 10) || 0;
                    const endMs = parseInt(timeMatch[8], 10) || 0;

                    const start = startH * 3600 + startM * 60 + startS + startMs / 1000;
                    const end = endH * 3600 + endM * 60 + endS + endMs / 1000;

                    // Teks subtitle adalah semua baris setelah timeLine
                    const textLines = lines.slice(timeLineIndex + 1);
                    const text = textLines.join(' ').trim(); // gabung jadi satu baris

                    if (text) {
                        subs.push({ start, end, text });
                    }
                }

                // Urutkan berdasarkan start time
                subs.sort((a, b) => a.start - b.start);
                return subs;
            }

            function wrapTextCustom(text, context, maxWidth) {
                if (!text) return [];
                const words = text.trim().split(' ');
                const lines = [];
                let currentLine = '';

                for (let word of words) {
                    let testLine = currentLine ? currentLine + ' ' + word : word;
                    if (context.measureText(testLine).width > maxWidth && currentLine) {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) lines.push(currentLine);
                return lines;
            }

            function renderFrame(targetCanvas, videoElement, subtitles, currentTime) {
                const tCtx = targetCanvas.getContext('2d');
                const W = targetCanvas.width;
                const H = targetCanvas.height;

                tCtx.clearRect(0, 0, W, H);

                const solidOn = solidBgToggle.checked;
                if (solidOn) {
                    tCtx.fillStyle = solidBgColorInput.value;
                    tCtx.fillRect(0, 0, W, H);
                } else if (videoElement && videoElement.readyState >= 2) {
                    tCtx.drawImage(videoElement, 0, 0, W, H);
                } else {
                    tCtx.fillStyle = '#111';
                    tCtx.fillRect(0, 0, W, H);
                }

                let activeSub = null;
                let lastSub = null;
                for (let sub of subtitles) {
                    if (currentTime >= sub.start && currentTime <= sub.end) {
                        activeSub = sub;
                        break;
                    }
                    if (currentTime > sub.end) lastSub = sub;
                }
                if (!activeSub) {
                    if (lastSub && (currentTime - lastSub.end) < 0.5) {
                        activeSub = lastSub;
                    } else {
                        return;
                    }
                }

                if (!activeSub) return;

                const textColor = textColorInput.value;
                const bgColor = bgColorInput.value;
                const useBg = useBgCheckbox.checked;
                const animStyle = animStyleSelect.value;
                const customFontSize = parseFloat(fontSizeInput.value) || 36;
                const layoutPos = layoutPosSelect.value;
                const textAlign = textAlignSelect.value;

                if (animStyle === 'typewriter') {
                    // --- Typewriter / Syntax Highlighting (Negoro Angin Style) ---
                    const theme = NEGRO_THEMES[negroThemeSelect.value] || NEGRO_THEMES.classic;
                    const charDur = TYPING_SPEEDS[typingSpeedSelect.value] ?? TYPING_SPEEDS.normal;
                    const cursorStyle = cursorStyleSelect.value;
                    const negroLayout = negroLayoutSelect.value;

                    const scaleF = W / 720;
                    const fSize = Math.min((customFontSize * 0.7) * scaleF, H * 0.08);
                    const monoFont = `bold ${fSize}px "JetBrains Mono", "Fira Code", Consolas, monospace`;
                    tCtx.font = monoFont;
                    tCtx.textAlign = 'left';
                    tCtx.textBaseline = 'top';

                    const maxW = W * 0.8;
                    const marginX = W * 0.1;

                    const linesToShow = subtitles.filter(s => currentTime >= s.start);
                    const lastN = Math.min(5, Math.floor((H * 0.7) / (fSize * 1.4)));
                    const displayLines = linesToShow.slice(-lastN);

                    const prompt = negroLayout === 'terminal' ? '$ ' : '';
                    const headerH = negroLayout === 'code' ? fSize * 2 : 0;

                    // Pre-wrap all lines to calculate total height
                    const wrappedLines = displayLines.map(line => {
                        let text = line.text;
                        if (line === displayLines[displayLines.length - 1]) {
                            if (charDur > 0) {
                                const n = Math.max(0, Math.min(text.length, Math.floor((currentTime - line.start) / charDur)));
                                text = text.slice(0, n);
                            }
                        }
                        return wrapTextCustom(prompt + text, tCtx, maxW);
                    });

                    const lineHeight = fSize * 1.4;
                    const totalH = wrappedLines.reduce((sum, lines) => sum + lines.length * lineHeight, 0);
                    const startY = Math.max(H * 0.15, H * 0.5 - totalH / 2) + headerH;

                    // Themed background panel for code/terminal layouts
                    if (negroLayout === 'code' || negroLayout === 'terminal') {
                        tCtx.save();
                        tCtx.globalAlpha = 0.85;
                        tCtx.fillStyle = theme.bg;
                        tCtx.fillRect(W * 0.05, H * 0.05, W * 0.9, H * 0.9);
                        tCtx.restore();
                    }

                    // Code editor header bar with window dots + title
                    if (negroLayout === 'code') {
                        const headerY = H * 0.05;
                        tCtx.save();
                        tCtx.globalAlpha = 0.95;
                        tCtx.fillStyle = 'rgba(255,255,255,0.06)';
                        tCtx.fillRect(W * 0.05, headerY, W * 0.9, headerH);

                        const dotR = fSize * 0.22;
                        const dotY = headerY + headerH / 2;
                        ['#ff5f56', '#ffbd2e', '#27c93f'].forEach((c, i) => {
                            tCtx.fillStyle = c;
                            tCtx.beginPath();
                            tCtx.arc(W * 0.08 + i * dotR * 3, dotY, dotR, 0, Math.PI * 2);
                            tCtx.fill();
                        });

                        tCtx.fillStyle = theme.text;
                        tCtx.font = `${fSize * 0.55}px "JetBrains Mono", Consolas, monospace`;
                        tCtx.textBaseline = 'middle';
                        tCtx.globalAlpha = 0.7;
                        tCtx.fillText('tiktok upil kering.txt', W * 0.08 + dotR * 10, dotY);
                        tCtx.restore();

                        tCtx.font = monoFont;
                        tCtx.textBaseline = 'top';
                    }

                    tCtx.save();
                    tCtx.beginPath();
                    tCtx.rect(W * 0.05, H * 0.05, W * 0.9, H * 0.9);
                    tCtx.clip();

                    let y = startY;
                    wrappedLines.forEach((lines, idx) => {
                        const isLast = idx === wrappedLines.length - 1;
                        const age = (wrappedLines.length - 1) - idx;
                        const opacity = isLast ? 1 : Math.max(0.2, 0.8 - age * 0.2);
                        tCtx.globalAlpha = opacity;

                        let currentX = marginX;
                        let lastX = marginX;
                        let lastY = y;
                        lines.forEach((lineText) => {
                            const parts = lineText.split(/("[^"]*"|[\(\)\{\}\.,])|(\s+)/);
                            parts.forEach(part => {
                                if (!part) return;
                                if (part.startsWith('"')) tCtx.fillStyle = theme.string;
                                else if (['(', ')', '{', '}', '.', ','].includes(part)) tCtx.fillStyle = theme.punct;
                                else if (/^[a-zA-Z_]+$/.test(part)) tCtx.fillStyle = theme.keyword;
                                else tCtx.fillStyle = theme.text;

                                tCtx.fillText(part, currentX, y);
                                currentX += tCtx.measureText(part).width;
                            });
                            lastX = currentX;
                            lastY = y;
                            y += lineHeight;
                            currentX = marginX;
                        });

                        if (isLast && cursorStyle !== 'none') {
                            const showCursor = cursorStyle === 'blink'
                                ? (Math.floor(currentTime * 2) % 2 === 0)
                                : true;
                            if (showCursor) {
                                tCtx.fillStyle = theme.cursor;
                                const cursorX = Math.min(lastX + 2, W * 0.88);
                                if (cursorStyle === 'line') {
                                    tCtx.fillRect(cursorX, lastY, Math.max(2, fSize * 0.12), fSize);
                                } else if (cursorStyle === 'underline') {
                                    tCtx.fillRect(cursorX, lastY + fSize * 0.9, fSize * 0.6, Math.max(2, fSize * 0.12));
                                } else {
                                    tCtx.fillRect(cursorX, lastY, fSize * 0.6, fSize);
                                }
                            }
                        }
                    });

                    tCtx.restore();
                    tCtx.globalAlpha = 1.0;
                    return;
                }

                // Handle animStyle === 'none' and 'word'
                if (animStyle === 'none' || animStyle === 'word') {
                    const scaleF = W / 720;
                    const fSize = customFontSize * scaleF;
                    tCtx.font = `bold ${fSize}px "Inter", "Segoe UI", sans-serif`;
                    tCtx.textAlign = textAlign;
                    tCtx.fillStyle = textColor;

                    if (useBg) {
                        tCtx.fillStyle = bgColor;
                        const textWidth = tCtx.measureText(activeSub.text).width;
                        const paddingX = 20 * scaleF;
                        const paddingY = 10 * scaleF;
                        let bgX, bgY;
                        if (textAlign === 'center') {
                            bgX = W / 2 - textWidth / 2 - paddingX;
                        } else if (textAlign === 'right') {
                            bgX = W - textWidth - paddingX * 2;
                        } else {
                            bgX = paddingX;
                        }
                        if (layoutPos === 'bottom') {
                            bgY = H - fSize - paddingY * 3;
                        } else if (layoutPos === 'top') {
                            bgY = paddingY;
                        } else {
                            bgY = H / 2 - fSize / 2;
                        }
                        tCtx.fillRect(bgX, bgY, textWidth + paddingX * 2, fSize + paddingY * 2);
                        tCtx.fillStyle = textColor;
                    }

                    let drawX, drawY;
                    if (textAlign === 'center') drawX = W / 2;
                    else if (textAlign === 'right') drawX = W - 20 * scaleF;
                    else drawX = 20 * scaleF;

                    if (layoutPos === 'bottom') drawY = H - 30 * scaleF;
                    else if (layoutPos === 'top') drawY = 40 * scaleF + fSize;
                    else drawY = H / 2 + fSize / 2;

                    if (animStyle === 'word') {
                        const words = activeSub.text.split(' ');
                        const duration = activeSub.end - activeSub.start;
                        const elapsed = currentTime - activeSub.start;
                        const wordIndex = Math.min(words.length - 1, Math.floor((elapsed / duration) * words.length));
                        let displayText = words.slice(0, wordIndex + 1).join(' ');
                        if (wordIndex < words.length - 1) displayText += ' ' + words[wordIndex + 1].slice(0, 1);
                        tCtx.fillText(displayText, drawX, drawY);
                    } else {
                        tCtx.fillText(activeSub.text, drawX, drawY);
                    }
                    return;
                }
            }

            function updatePreviewCanvas() {
                const res = RESOLUTIONS[resolutionSelect.value];
                previewCanvas.width = res.width;
                previewCanvas.height = res.height;
                previewCtx.fillStyle = '#000';
                previewCtx.fillRect(0, 0, res.width, res.height);
                previewCtx.fillStyle = '#666';
                previewCtx.font = '24px Arial';
                previewCtx.textAlign = 'center';
                previewCtx.fillText('Preview Area', res.width / 2, res.height / 2);
            }

            let isPreviewing = false;
            let animId = null;

            previewBtn.addEventListener('click', () => {
                if (isPreviewing) stopPreview(); else startPreview();
            });

            function startPreview() {
                const hasVideo = sourceVideo.src && sourceVideo.readyState >= 2;
                const res = RESOLUTIONS[resolutionSelect.value];
                previewCanvas.width = res.width;
                previewCanvas.height = res.height;

                isPreviewing = true;
                previewBtn.textContent = '⏹ Stop Preview';
                previewBtn.classList.add('active');
                previewControls.style.display = 'flex';

                if (hasVideo) {
                    sourceVideo.muted = true;
                    sourceVideo.play();
                } else {
                    sourceVideo._fakeDuration = Math.max(getRenderDuration(), 5);
                    sourceVideo._fakeTime = 0;
                    sourceVideo._lastTick = performance.now();
                    statusMsg.textContent = '💡 Preview Mode (Tanpa Video)';
                }

                const subs = getSubtitles();

                function loop() {
                    if (!isPreviewing) return;
                    let currentTime = 0;
                    if (hasVideo) {
                        currentTime = sourceVideo.currentTime;
                        seekBar.value = (currentTime / sourceVideo.duration) * 100 || 0;
                    } else {
                        const now = performance.now();
                        const delta = (now - sourceVideo._lastTick) / 1000;
                        sourceVideo._lastTick = now;
                        sourceVideo._fakeTime = (sourceVideo._fakeTime + delta) % sourceVideo._fakeDuration;
                        currentTime = sourceVideo._fakeTime;
                        seekBar.value = (currentTime / sourceVideo._fakeDuration) * 100;
                    }
                    renderFrame(previewCanvas, sourceVideo, subs, currentTime);
                    timeDisplay.textContent = currentTime.toFixed(1) + 's';
                    animId = requestAnimationFrame(loop);
                }
                animId = requestAnimationFrame(loop);
            }

            function stopPreview() {
                isPreviewing = false;
                cancelAnimationFrame(animId);
                sourceVideo.pause();
                sourceVideo.muted = true;
                previewBtn.textContent = '👁 Preview';
                previewBtn.classList.remove('active');
                solidBgToggle.disabled = false;
            }

            function getRenderDuration() {
                if (sourceVideo.src && sourceVideo.readyState >= 2) {
                    return sourceVideo.duration;
                }
                const subs = getSubtitles();
                if (subs.length > 0) {
                    const maxEnd = Math.max(...subs.map(s => s.end));
                    return Math.max(maxEnd + 0.5, 1);
                }
                return 0;
            }

            videoInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (sourceVideo.src.startsWith('blob:')) URL.revokeObjectURL(sourceVideo.src);
                    sourceVideo.src = URL.createObjectURL(file);
                    sourceVideo.load();
                    statusMsg.textContent = '✅ Video berhasil dimuat!';
                }
                solidBgToggle.disabled = false;
            });

            renderBtn.addEventListener('click', () => {
                console.log('[render] start', { hasVideo: sourceVideo.src && sourceVideo.readyState >= 2, subs: getSubtitles().length });
                const duration = getRenderDuration();
                console.log('[render] duration:', duration);
                if (duration <= 0) {
                    statusMsg.textContent = '❌ Tidak ada video atau subtitle untuk dirender.';
                    return;
                }
                if (isPreviewing) stopPreview();

                const hasVideo = sourceVideo.src && sourceVideo.readyState >= 2;

                const res = RESOLUTIONS[resolutionSelect.value];
                canvas.width = res.width;
                canvas.height = res.height;

                if (hasVideo) {
                    sourceVideo.currentTime = 0;
                    sourceVideo.muted = true;
                }

                // Force solid bg if no video
                if (!hasVideo) {
                    solidBgToggle.checked = true;
                    solidBgToggle.disabled = true;
                }

                const stream = canvas.captureStream(30);
                let format = formatSelect.value;
                let mime = getSupportedMimeType(format);
                if (!mime) mime = 'video/webm';

                const solidOn = solidBgToggle.checked;
                const bitrate = solidOn ? 800000 : 4000000;

                let recorder;
                try {
                    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: bitrate });
                } catch (e) {
                    recorder = new MediaRecorder(stream);
                }

                // ─── DEBUG: tambahan supaya penyebab kelihatan ───
                recorder.onerror = (e) => {
                    console.error('[render] recorder error', e.error || e);
                    statusMsg.textContent = '❌ Recorder error: ' + (e.error?.name || 'unknown');
                    renderBtn.disabled = false;
                };
                console.log('[render] mime dipakai:', recorder.mimeType);
                // ────────────────────────────────────────────────

                let chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    console.log('[render] onstop', { chunks: chunks.length, mime });
                    if (chunks.length === 0) {
                        statusMsg.textContent = '❌ Render gagal: tidak ada data terekam.';
                        renderBtn.disabled = false;
                        renderBtn.textContent = '▶ Mulai Render Video';
                        return;
                    }
                    const ext = mime.includes('mp4') ? 'mp4' : 'webm';
                    const blob = new Blob(chunks, { type: mime });
                    const url = URL.createObjectURL(blob);
                    if (downloadLink.href.startsWith('blob:')) URL.revokeObjectURL(downloadLink.href);
                    downloadLink.href = url;
                    downloadLink.download = `capcut_subtitled_video.${ext}`;
                    downloadLink.textContent = `⬇️ Unduh Hasil Video (${ext.toUpperCase()})`;
                    downloadLink.classList.add('active');
                    statusMsg.textContent = `✅ Render selesai! Format ${ext.toUpperCase()}`;
                    renderBtn.disabled = false;
                    renderBtn.textContent = '▶ Mulai Render Video';
                    if (!hasVideo) {
                        solidBgToggle.disabled = false;
                    }
                };

                // Render first frame before starting recorder
                const subs = getSubtitles();
                renderFrame(canvas, hasVideo ? sourceVideo : null, subs, 0);

                recorder.start();
                const startTime = performance.now();

                function renderLoop() {
                    let currentTime;
                    if (hasVideo) {
                        currentTime = sourceVideo.currentTime;
                        if (sourceVideo.ended || currentTime >= sourceVideo.duration) {
                            recorder.stop();
                            sourceVideo.pause();
                            return;
                        }
                    } else {
                        currentTime = (performance.now() - startTime) / 1000;
                        if (currentTime >= duration) {
                            recorder.stop();
                            return;
                        }
                    }

                    // ─── PROGRESS UPDATE ───
                    const pct = Math.min(100, Math.round((currentTime / duration) * 100));
                    renderBtn.textContent = `⏳ Merender ${pct}%`;
                    statusMsg.textContent = `⏳ Render: ${pct}% (${currentTime.toFixed(1)}s / ${duration.toFixed(1)}s)`;
                    // ───────────────────────

                    renderFrame(canvas, hasVideo ? sourceVideo : null, subs, currentTime);
                    requestAnimationFrame(renderLoop);
                }

                if (hasVideo) {
                    sourceVideo.play();
                }
                requestAnimationFrame(renderLoop);
            });

            // Event handlers for preview controls
            seekBar.addEventListener('input', () => {
                if (sourceVideo.readyState >= 2) {
                    const percent = seekBar.value / 100;
                    sourceVideo.currentTime = percent * sourceVideo.duration;
                } else if (sourceVideo._fakeDuration) {
                    const percent = seekBar.value / 100;
                    sourceVideo._fakeTime = percent * sourceVideo._fakeDuration;
                    sourceVideo._lastTick = performance.now();
                }
            });

            playPauseBtn.addEventListener('click', () => {
                if (sourceVideo.readyState >= 2) {
                    if (sourceVideo.paused) {
                        sourceVideo.play();
                        playPauseBtn.textContent = '⏸';
                    } else {
                        sourceVideo.pause();
                        playPauseBtn.textContent = '▶';
                    }
                } else if (sourceVideo._fakeDuration) {
                    isPreviewing = !isPreviewing;
                    playPauseBtn.textContent = isPreviewing ? '⏸' : '▶';
                    if (isPreviewing) {
                        startPreview();
                    } else {
                        stopPreview();
                    }
                }
            });

            updatePreviewCanvas();
            renderSegmentCards(getSubtitles());
        })();
    </script>
</body>

</html>
